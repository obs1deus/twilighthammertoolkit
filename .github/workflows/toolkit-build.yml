name: Build Toolkit release candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolkit-build.yml'
      - 'addon/**'
      - 'toolkit/**'
      - 'TwilightSetup.cs'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build from checked-out source
        shell: powershell
        run: |
          .\toolkit\Build.ps1
          $exe = Get-Item dist/Toolkit/TwilightHammerToolkit.exe
          $version = $exe.VersionInfo
          if ($version.ProductName -ne 'Twilight Hammer Toolkit' -or
              $version.ProductVersion -notmatch '^\d+\.\d+\.\d+$' -or
              $version.FileVersion -ne "$($version.ProductVersion).0") {
            throw 'Unexpected Toolkit product metadata.'
          }
          Get-FileHash $exe.FullName -Algorithm SHA256
      - name: Upload unsigned EXE for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolkit-unsigned
          path: dist/Toolkit/TwilightHammerToolkit.exe
          if-no-files-found: error
      - name: Upload release documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolkit-release-documentation
          path: |
            dist/Toolkit/README.txt
            dist/Toolkit/LICENSE
            dist/Toolkit/WebView2-LICENSE.txt
            dist/Toolkit/WebView2-NOTICE.txt
          if-no-files-found: error
